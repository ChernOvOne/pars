  - name: cloudru
    type: cloudru
    enabled: false              # ключ сервисного аккаунта (console.cloud.ru)
    key_id_env: CLOUDRU_KEY_ID
    key_secret_env: CLOUDRU_KEY_SECRET
    project_id_env: CLOUDRU_PROJECT_ID
    # wlfinder крутит рулетку на floating IP (без ВМ) — нужна только зона.
    availability_zone: ru.AZ-1  # ещё: ru.AZ-2, ru.AZ-3

  - name: clo-msk
    type: clo
    enabled: false
    token_env: CLO_TOKEN
    flavor: ""                  # id/слаг тарифа
    image: ""                   # id/слаг образа ОС
    region: msk

  - name: onecloud-msk
    type: 1cloud
    enabled: false
    token_env: ONECLOUD_TOKEN
    cpu: 1
    ram: 1024                   # МБ
    hdd: 20                     # ГБ
    hdd_type: SSD
    image_id: 0                 # ID образа ОС из 1cloud
    dc_location: SdnLandsbergiPlatz

notify:
  telegram:
    enabled: true
    bot_token_env: TELEGRAM_BOT_TOKEN   # имя env-переменной с токеном бота
    chat_id: "123456789"                # chat_id админа (или группы)
