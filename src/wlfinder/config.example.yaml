general:
  log_level: INFO
  db_path: ~/.local/share/wlfinder/wlfinder.db
  cache_dir: ~/.cache/wlfinder

whitelist:
  # Только TWL — сканер openlibrecommunity ежедневно пробивает IPv4 через
  # реальные симки МТС/Билайн/МегаФон/Т2 и вносит только те IP/подсети, что
  # реально ответили через мобильные данные. Свежесть — сутки.
  #
  # hxehex/* (legacy, статичный) НЕ подключён специально: он широко метил
  # /24 много лет назад, но операторы давно вывели половину этих подсетей
  # из whitelist'ов. Такой источник даёт «фантомные» HIT'ы — wlfinder
  # засчитывает IP как белый, а через симку он не работает. Пример: HIT
  # 5.159.100.248 (ru-3) — в hxehex-cidr есть, в TWL нет, реально не
  # проходит через операторов.
  #
  # Если очень хочется больше кандидатов на camp — понизить min_percent
  # у twl-subnets (например до 30). Это добавит /24 «частично работающих»,
  # где не все 254 IP белые — camp будет чаще получать чёрные IP, но реже
  # промахиваться мимо оператора.
  sources:
    - type: github
      name: twl-verified
      url: https://raw.githubusercontent.com/openlibrecommunity/twl/main/code/scan/out/verify/verified.txt
    - type: twl_subnets
      name: twl-subnets
      url: https://raw.githubusercontent.com/openlibrecommunity/twl/main/code/subnet/out/subnets.c.json
      min_percent: 50
  refresh_ttl_hours: 12

orchestrator:
  # Для subnet-camp у Selectel: много попыток, короткая пауза, параллельные
  # воркеры по разным хостерам-подсетям. При обычной рулетке (без
  # target_subnet_cidr) — max_attempts: 30, delay: 15, batch_size: 6 хватит.
  max_attempts: 5000
  delay_between_attempts_sec: 3
  parallel_workers: 6            # столько подсетей будет кампиться одновременно
  bail_on_balance_threshold_rub: 50
  # batch-hold: пачка выделяет N IP разом и держит все — провайдер вынужден
  # отдавать разные адреса (внутри пачки все N IP уникальны). Для camp-режима
  # batch_size=1 у хостера, чтобы одна попытка = один запрос.
  batch_size: 6

hosters:
  - name: timeweb-msk
    type: timeweb
    enabled: true
    token_env: TIMEWEB_TOKEN
    # Рулетка крутится на floating IP (без VPS). preset_id/os_id/bandwidth
    # нужны ТОЛЬКО для сервера, который создаётся при ПОПАДАНИИ (promote);
    # без preset_id хит просто оставляет зарезервированный белый IP.
    availability_zone: msk-1    # Москва (ещё: spb-1, spb-2, nsk-1)
    preset_id: 4799            # московский тариф для сервера на хите
    os_id: 99                  # Ubuntu 24.04
    bandwidth: 1000            # минимум для preset 4799

  - name: regru-msk
    type: regru
    enabled: true
    token_env: REGRU_TOKEN
    size: cloud-1
    image: ubuntu-22-04-amd64
    region_slug: msk1
    ssh_key_fingerprints: []    # пусто = ключ wlfinder зальётся автоматически

  # -------- Selectel: subnet-camp -------------------------------------------
  # Один хостер = одна конкретная /24 в whitelist. Каждый create() пиннит
  # floating IP в целевой subnet_id через Neutron. Selectel часто отвечает
  # 409 IpAddressGenerationFailure ("подсеть полностью занята") — это ок,
  # orchestrator посчитает batch soft-miss и попробует ещё раз. Как только
  # чей-то IP освободится — wlfinder его тут же схватит с гарантированным
  # попаданием в /24.
  #
  # Требования service-user'а: роли compute.admin + vpc.external_access.admin
  # в проекте. Как проверить/обновить карту подсетей vs whitelist — см.
  # scripts/selectel-scan.sh.
  #
  # Подсети ниже — снимок на 2026-07-29. Свежие данные: pars asn-stats.

  - name: selectel-ru3-87.228.101
    type: selectel
    enabled: true
    account_id_env: SELECTEL_ACCOUNT_ID
    service_user_env: SELECTEL_SERVICE_USER
    service_pass_env: SELECTEL_SERVICE_PASS
    project_id_env: SELECTEL_PROJECT_ID
    region: ru-3
    target_subnet_cidr: 87.228.101.0/24   # 70 TWL-verified IP — самая плотная
    batch_size: 1                          # каждая попытка — один запрос

  - name: selectel-ru1-46.182.24
    type: selectel
    enabled: true
    account_id_env: SELECTEL_ACCOUNT_ID
    service_user_env: SELECTEL_SERVICE_USER
    service_pass_env: SELECTEL_SERVICE_PASS
    project_id_env: SELECTEL_PROJECT_ID
    region: ru-1
    target_subnet_cidr: 46.182.24.0/24     # 62 TWL-verified IP
    batch_size: 1

  - name: selectel-ru3-185.91.52
